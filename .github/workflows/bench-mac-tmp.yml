name: bench-mac-tmp
on:
  push:
    branches: [claude/project-thread-79zl38]
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: rustup toolchain install stable --profile minimal && rustup default stable && cargo build --release -p sandfs-cli
      - name: Bench
        run: bench-mac/run.sh
  sonny:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: rustup toolchain install stable --profile minimal && rustup default stable && cargo build --release -p sandfs-cli
      - name: Bench
        run: bench-mac/sonny.sh
  copies:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: rustup toolchain install stable --profile minimal && rustup default stable && cargo build --release -p sandfs-cli -p sandfs-bench
      - name: Copies table
        run: ./target/release/sandfs-bench --only copies --scale quick --scratch /tmp --sandfs-bin target/release/sandfs --json /tmp/copies.json | tee -a "$GITHUB_STEP_SUMMARY"
