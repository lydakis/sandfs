name: xp-linux
on:
  push:
    branches: [claude/project-thread-jx4nw5]
    paths: ["xp/linux.sh", "xp/ops.py", ".github/workflows/xp-linux.yml"]
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          uname -a
          sudo apt-get update -q && sudo apt-get install -y -q fuse3 btrfs-progs xfsprogs meson ninja-build liburing-dev pkg-config g++ > /dev/null
          rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build libfuse 3.18.1 examples
        run: |
          git clone -q --depth 1 --branch fuse-3.18.1 https://github.com/libfuse/libfuse /tmp/libfuse
          cd /tmp/libfuse && meson setup build -Dexamples=true -Dutils=false -Dtests=false | grep -i uring; ninja -C build > /dev/null
          ls -la build/example/passthrough_hp
      - name: Build sandfs
        run: cargo build --release -p sandfs-cli
      - name: Experiment
        run: sudo env "PATH=$PATH" "HOME=$HOME" "GITHUB_STEP_SUMMARY=$GITHUB_STEP_SUMMARY" xp/linux.sh
