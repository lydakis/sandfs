name: Release

# Every pull request builds the wheels and sdist and installs them, so packaging
# breaks show up before a release. Only a pushed `v*` tag publishes, to PyPI and
# crates.io. Running the workflow by hand on a tag publishes any crates still missing.
on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  wheels:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, smoke: true }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64, smoke: true }
          - { os: windows-latest, target: x64, smoke: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One abi3 wheel per platform covers every Python from 3.11 up.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      # Install the wheel on the runners that can execute it and use it once.
      - if: matrix.smoke
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - if: matrix.smoke
        name: Smoke-test the wheel
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist sandfs
          cd "$RUNNER_TEMP"
          python -I -c "import sandfs; ws = sandfs.Workspace(); ws.mount('/m', sandfs.MemorySource({'a.txt': 'hi'})); f = ws.fork(); f.write('/m/b.bin', b'data'); assert ws.read_text('/m/a.txt') == 'hi'; assert [(c.kind, c.path) for c in f.changes()] == [('added', '/m/b.bin')]; print(sandfs.__version__)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdist
          path: dist

  publish:
    needs: [wheels, sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      # The version comes from Cargo.toml; refuse to publish under a different tag.
      - name: Check the tag matches the package version
        run: test -f "dist/sandfs-${GITHUB_REF_NAME#v}.tar.gz"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

  crates:
    # crates.io versions are permanent, so publish only once every artifact built.
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # Publishes every crate without `publish = false` that crates.io lacks at this
      # version, dependencies first, so a re-run finishes a partial release.
      - name: Publish to crates.io
        run: |
          version="${GITHUB_REF_NAME#v}"
          metadata="$(cargo metadata --no-deps --format-version 1)"
          if [ "$(jq -r '.packages[] | select(.name == "sandfs-core") | .version' <<<"$metadata")" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the Cargo.toml version"
            exit 1
          fi
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set, so no crates were published"
            exit 0
          fi
          packages=()
          for crate in $(jq -r '.packages[] | select(.publish != []) | .name' <<<"$metadata"); do
            if ! curl -sf -A "sandfs-release (https://github.com/lydakis/sandfs)" "https://crates.io/api/v1/crates/$crate/$version" > /dev/null; then
              packages+=(-p "$crate")
            fi
          done
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "Every crate is already on crates.io at $version"
            exit 0
          fi
          cargo publish "${packages[@]}"
