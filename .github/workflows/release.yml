name: Release

# Every pull request builds the wheels and sdist and installs them, so packaging
# breaks show up before a release. Only a pushed `v*` tag publishes, to PyPI and
# crates.io. Running the workflow by hand on a tag publishes any crates still missing.
on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  wheels:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, smoke: true }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64, smoke: true }
          - { os: windows-latest, target: x64, smoke: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One abi3 wheel per platform covers every Python from 3.11 up.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      # Install the wheel on the runners that can execute it and use it once.
      - if: matrix.smoke
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - if: matrix.smoke
        name: Smoke-test the wheel
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist sandfs
          cd "$RUNNER_TEMP"
          python -I -c "import sandfs; ws = sandfs.Workspace(); ws.mount('/m', sandfs.MemorySource({'a.txt': 'hi'})); f = ws.fork(); f.write('/m/b.bin', b'data'); assert ws.read_text('/m/a.txt') == 'hi'; assert [(c.kind, c.path) for c in f.changes()] == [('added', '/m/b.bin')]; print(sandfs.__version__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist

  # The `sandfs` command, ready to run, for people who'd rather not build it. Pull
  # requests build it too; a tag attaches it to the GitHub release.
  cli:
    strategy:
      matrix:
        include:
          # musl, so the Linux builds are static and run on any distribution.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Build
        run: cargo build --release --locked -p sandfs-cli --target ${{ matrix.target }}
      - name: Package
        run: |
          name="sandfs-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/sandfs" LICENSE crates/sandfs-cli/README.md "$name/"
          cp crates/sandfs-cli/src/nfsserve/LICENSE "$name/LICENSE-nfsserve"
          tar czf "$name.tar.gz" "$name"
      # Run it where the runner can: every target but the Intel Mac build.
      - if: matrix.target != 'x86_64-apple-darwin'
        name: Smoke-test the command
        run: |
          "sandfs-${{ matrix.target }}/sandfs" --version
          SANDFS_HOME="$RUNNER_TEMP/home" "sandfs-${{ matrix.target }}/sandfs" list
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: sandfs-${{ matrix.target }}.tar.gz

  github-release:
    needs: [cli, wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: cli
          merge-multiple: true
      # Attach the commands to the tag's release, making it from the changelog's
      # entry for this version when nobody has yet.
      - name: Attach the commands to the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The other jobs check this too, but they run alongside this one.
          if [ "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sandfs-core") | .version')" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the Cargo.toml version"
            exit 1
          fi
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            awk -v heading="## $version" 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found' docs/changelog.md > notes.md
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "sandfs $version" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" cli/*.tar.gz --clobber

  publish:
    needs: [wheels, sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      # Only the Python packages: the run's other artifacts (the `sandfs` archives)
      # aren't for PyPI, which refuses the whole upload over them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      # The version comes from Cargo.toml; refuse to publish under a different tag.
      - name: Check the tag matches the package version
        run: test -f "dist/sandfs-${GITHUB_REF_NAME#v}.tar.gz"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

  crates:
    # crates.io versions are permanent, so publish only once every artifact built.
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # Publishes every crate without `publish = false` that crates.io lacks at this
      # version, dependencies first, so a re-run finishes a partial release.
      - name: Publish to crates.io
        run: |
          version="${GITHUB_REF_NAME#v}"
          metadata="$(cargo metadata --no-deps --format-version 1)"
          if [ "$(jq -r '.packages[] | select(.name == "sandfs-core") | .version' <<<"$metadata")" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the Cargo.toml version"
            exit 1
          fi
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set, so no crates were published"
            exit 0
          fi
          packages=()
          for crate in $(jq -r '.packages[] | select(.publish != []) | .name' <<<"$metadata"); do
            if ! curl -sf -A "sandfs-release (https://github.com/lydakis/sandfs)" "https://crates.io/api/v1/crates/$crate/$version" > /dev/null; then
              packages+=(-p "$crate")
            fi
          done
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "Every crate is already on crates.io at $version"
            exit 0
          fi
          cargo publish "${packages[@]}"
