name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Create virtual environment
        run: uv venv
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install dependencies (builds the Rust extension)
        run: |
          uv pip install -e .[dev]
      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check sandfs tests
      - name: Run MyPy
        run: |
          uv run mypy sandfs
      - name: Run pytest
        run: |
          uv run pytest

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install FUSE and bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y fuse3 bubblewrap
          # Ubuntu keeps unprivileged programs out of user namespaces, which `sandfs shell` uses.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Run tests
        run: cargo test --workspace
        env:
          SANDFS_REQUIRE_FUSE: "1"
      # A fork of a clone is a real folder where the disk clones files, as btrfs does,
      # and a mount on ext4, which the runner's own disk is.
      - name: Run the command's tests on btrfs
        run: |
          sudo apt-get install -y btrfs-progs
          truncate -s 1G "$RUNNER_TEMP/btrfs.img" && sudo mkfs.btrfs -q "$RUNNER_TEMP/btrfs.img"
          sudo mkdir /mnt/btrfs && sudo mount -o loop "$RUNNER_TEMP/btrfs.img" /mnt/btrfs
          sudo chown "$USER" /mnt/btrfs
          TMPDIR=/mnt/btrfs cargo test -p sandfs-cli
        env:
          SANDFS_REQUIRE_FUSE: "1"
          SANDFS_REQUIRE_REFLINK: "1"
      - name: Check the crates package
        run: cargo package --workspace --exclude sandfs-py

  # Everything but the benchmarks (overlayfs, Linux-only) works on macOS and Windows
  # too. macOS mounts with its own NFS client, so its mount tests run here as well;
  # Windows builds the CLI without the mount.
  other-os:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Run Clippy
        run: cargo clippy -p sandfs-core -p sandfs-git -p sandfs-mcp -p sandfs-py -p sandfs -p sandfs-cli --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test -p sandfs-core -p sandfs-git -p sandfs-mcp -p sandfs -p sandfs-cli
        env:
          SANDFS_REQUIRE_FUSE: ${{ runner.os == 'macOS' && '1' || '' }}
      - name: Build the CLI without the mount
        if: runner.os == 'macOS'
        run: cargo clippy -p sandfs -p sandfs-cli --no-default-features --all-targets -- -D warnings
      - name: Check and test the benchmarks
        if: runner.os == 'macOS'
        run: |
          cargo clippy -p sandfs-bench --all-targets -- -D warnings
          cargo test -p sandfs-bench
      - name: Install uv
        run: pip install uv
      - name: Install the package (builds the Rust extension)
        run: |
          uv venv
          uv pip install -e .[dev]
      - name: Run pytest
        run: uv run pytest
