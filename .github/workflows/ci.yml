name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Create virtual environment
        run: uv venv
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install dependencies (builds the Rust extension)
        run: |
          uv pip install -e .[dev]
      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check sandfs tests
      - name: Run MyPy
        run: |
          uv run mypy sandfs
      - name: Run pytest
        run: |
          uv run pytest

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install FUSE
        run: sudo apt-get update && sudo apt-get install -y fuse3
      - name: Run tests
        run: cargo test --workspace
        env:
          SANDFS_REQUIRE_FUSE: "1"
      - name: Check the crates package
        run: cargo package --workspace --exclude sandfs-py
