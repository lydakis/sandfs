name: Benchmarks

# Pull requests: main and the PR are built on one machine and the quick suite runs on
# each twice, alternating, so both sides see the same machine; the comparison goes in
# the run's summary, with a warning when numbers got slower. Shared machines vary from
# run to run, so this warns instead of failing. Pushes to main keep their results as
# an artifact, for a history of the numbers.

on:
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/bench.yml"]
  pull_request:
    branches: [main]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/bench.yml"]

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install FUSE and Rust
        run: |
          sudo apt-get update && sudo apt-get install -y fuse3
          rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build this commit
        run: |
          cargo build --release -p sandfs-cli -p sandfs-bench
          mkdir -p /tmp/after && cp target/release/sandfs target/release/sandfs-bench /tmp/after/
      - name: Build main
        if: github.event_name == 'pull_request'
        run: |
          git worktree add /tmp/main-src ${{ github.event.pull_request.base.sha }}
          # The shared target directory keeps the dependencies built above.
          CARGO_TARGET_DIR=$PWD/target cargo build --release --manifest-path /tmp/main-src/Cargo.toml -p sandfs-cli -p sandfs-bench
          mkdir -p /tmp/before && cp target/release/sandfs target/release/sandfs-bench /tmp/before/
      - name: Run the quick suite
        run: |
          # The build table takes minutes and measures cargo more than sandfs; leave it out
          # where the suite can. Each side runs its own suite, which holds its own library.
          run() {
            skip=""
            "$1/sandfs-bench" --help | grep -q -- --skip && skip="--skip build"
            "$1/sandfs-bench" --scale quick --scratch /dev/shm $skip --sandfs-bin "$1/sandfs" --json "$2" > "$2.txt"
          }
          # Copies of a clone: what this table measures is the sandfs program, so both
          # sides run this commit's table with their own program.
          copies() {
            /tmp/after/sandfs-bench --only copies --scale quick --scratch /tmp --sandfs-bin "$1/sandfs" --json "$2" > "$2.txt"
          }
          for round in 1 2; do
            if [ "${{ github.event_name }}" = pull_request ]; then
              run /tmp/before /tmp/before-$round.json
              copies /tmp/before /tmp/before-copies-$round.json
            fi
            run /tmp/after /tmp/after-$round.json
            copies /tmp/after /tmp/after-copies-$round.json
          done
      - name: Compare with main
        if: github.event_name == 'pull_request'
        run: |
          runs() { ls /tmp/$1-*.json | paste -sd, -; }
          /tmp/after/sandfs-bench --compare "$(runs before)" "$(runs after)" | tee /tmp/compare.md
          {
            echo "## Benchmarks: this PR against main"
            echo
            cat /tmp/compare.md
            echo
            echo "<details><summary>This PR's full results</summary>"
            echo
            cat /tmp/after-1.json.txt /tmp/after-copies-1.json.txt
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          slower=$(sed -n 's/.*; \([0-9]*\) got slower;.*/\1/p' /tmp/compare.md)
          missing=$(sed -n 's/.*; \([0-9]*\) went missing\./\1/p' /tmp/compare.md)
          if [ "${slower:-0}" -gt 0 ] || [ "${missing:-0}" -gt 0 ]; then
            echo "::warning title=Benchmarks::${slower:-0} numbers got slower than on main and ${missing:-0} went missing; see the run's summary"
          fi
      - name: Summarize
        if: github.event_name == 'push'
        run: |
          { echo "## Benchmarks on ${{ github.sha }}"; echo; cat /tmp/after-1.json.txt /tmp/after-copies-1.json.txt; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ github.sha }}
          path: /tmp/after-*.json
          retention-days: 90

  # The same suite on a Mac, where the mount is served over NFS, kept for a history of
  # the Mac numbers. On pull requests the copies table also runs against main's
  # program, alternating as above, and the comparison goes in the summary.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build
        run: |
          cargo build --release -p sandfs-cli -p sandfs-bench
          mkdir -p /tmp/after && cp target/release/sandfs target/release/sandfs-bench /tmp/after/
      - name: Build main
        if: github.event_name == 'pull_request'
        run: |
          git worktree add /tmp/main-src ${{ github.event.pull_request.base.sha }}
          CARGO_TARGET_DIR=$PWD/target cargo build --release --manifest-path /tmp/main-src/Cargo.toml -p sandfs-cli
          mkdir -p /tmp/before && cp target/release/sandfs /tmp/before/
      - name: Run the quick suite
        run: |
          /tmp/after/sandfs-bench --scale quick --scratch /tmp --skip build --targets host,sandfs,fuse \
            --sandfs-bin /tmp/after/sandfs --json /tmp/macos.json > /tmp/macos.txt
          copies() {
            /tmp/after/sandfs-bench --only copies --scale quick --scratch /tmp --sandfs-bin "$1/sandfs" --json "$2" > "$2.txt"
          }
          for round in 1 2; do
            if [ "${{ github.event_name }}" = pull_request ]; then copies /tmp/before /tmp/macos-before-copies-$round.json; fi
            copies /tmp/after /tmp/macos-copies-$round.json
          done
          {
            echo "## Benchmarks on macOS, ${{ github.sha }}"
            echo
            if [ "${{ github.event_name }}" = pull_request ]; then
              echo "### Copies of a clone: this PR against main"
              echo
              /tmp/after/sandfs-bench --compare /tmp/macos-before-copies-1.json,/tmp/macos-before-copies-2.json \
                /tmp/macos-copies-1.json,/tmp/macos-copies-2.json
              echo
            fi
            cat /tmp/macos.txt /tmp/macos-copies-1.json.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: bench-macos-${{ github.sha }}
          path: /tmp/macos*.json
          retention-days: 90
