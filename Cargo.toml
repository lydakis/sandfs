[workspace]
resolver = "3"
members = ["crates/sandfs-bench", "crates/sandfs-cli", "crates/sandfs-core", "crates/sandfs-git", "crates/sandfs-mcp", "crates/sandfs-py"]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/lydakis/sandfs"
homepage = "https://github.com/lydakis/sandfs"

[workspace.dependencies]
bytes = "1.12"
imbl = "7.0"
thiserror = "2.0"
sandfs-core = { path = "crates/sandfs-core", version = "0.5.1" }
sandfs-git = { path = "crates/sandfs-git", version = "0.5.1" }
sandfs-mcp = { path = "crates/sandfs-mcp", version = "0.5.1" }
sandfs-cli = { path = "crates/sandfs-cli", version = "0.5.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
