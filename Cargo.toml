[workspace]
resolver = "3"
members = ["crates/sandfs", "crates/sandfs-bench", "crates/sandfs-cli", "crates/sandfs-core", "crates/sandfs-git", "crates/sandfs-mcp", "crates/sandfs-py"]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/lydakis/sandfs"
homepage = "https://github.com/lydakis/sandfs"

[workspace.dependencies]
bytes = "1.12"
imbl = "7.0"
thiserror = "2.0"
sandfs-core = { path = "crates/sandfs-core", version = "0.9.0" }
sandfs-git = { path = "crates/sandfs-git", version = "0.9.0" }
sandfs-mcp = { path = "crates/sandfs-mcp", version = "0.9.0" }
sandfs = { path = "crates/sandfs", version = "0.9.0", default-features = false }
sandfs-cli = { path = "crates/sandfs-cli", version = "0.9.0" }

[workspace.lints.rust]
# Deny rather than forbid: `memory::give_back` in the sandfs crate is the one audited
# exception, allowed on that call alone.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
