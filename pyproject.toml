[build-system]
requires = ["maturin>=1.15.0,<2"]
build-backend = "maturin"

[project]
name = "sandfs"
dynamic = ["version"]
description = "A lazy, copy-on-write sandbox filesystem for agents: mount any data, fork in O(1), see what changed"
requires-python = ">=3.11"
authors = [
  { name = "sandfs contributors" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["virtual filesystem", "sandbox", "agents", "copy-on-write", "workspace"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Filesystems",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "mypy>=2.4.0",
  "ruff>=0.17.1",
  "pre-commit>=4.7.0",
]

[project.urls]
Homepage = "https://github.com/lydakis/sandfs"
Repository = "https://github.com/lydakis/sandfs"
Issues = "https://github.com/lydakis/sandfs/issues"

[tool.maturin]
manifest-path = "crates/sandfs-py/Cargo.toml"
module-name = "sandfs._core"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true
check_untyped_defs = true
disallow_incomplete_defs = true
files = ["sandfs"]
