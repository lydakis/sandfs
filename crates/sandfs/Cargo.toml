[package]
name = "sandfs"
description = "Lazy, copy-on-write workspaces over folders and git repositories, saved on disk and mounted as directories (FUSE on Linux, NFS on macOS): the library behind the sandfs command"
readme = "README.md"
keywords = ["fuse", "nfs", "filesystem", "sandbox", "copy-on-write"]
categories = ["filesystem"]
version.workspace = true
edition.workspace = true
# `File::try_lock`, which keeps one process saving each workspace, is 1.89+.
rust-version = "1.89"
# The NFS server in src/nfsserve is nfsserve's, under BSD-3-Clause.
license = "MIT AND BSD-3-Clause"
repository.workspace = true
homepage.workspace = true

[features]
default = ["mount"]
# The mount: FUSE on Linux, and on macOS an NFS server on localhost that macOS's own
# NFS client mounts, so nothing needs installing.
mount = ["dep:fuser", "dep:tokio", "dep:async-trait", "dep:byteorder", "dep:num-derive", "dep:num-traits", "dep:tracing"]

[dependencies]
anyhow = "1"
bytes.workspace = true
reflink-copy = "0.1"
sandfs-core.workspace = true
sandfs-git.workspace = true
sandfs-mcp.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["fs", "process", "resource", "signal", "user"] }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", optional = true }

# On macOS fuser only lends the NFS mount its types; it never mounts. The NFS server
# (src/nfsserve) needs the rest.
[target.'cfg(target_os = "macos")'.dependencies]
async-trait = { version = "0.1", optional = true }
byteorder = { version = "1.4", optional = true }
fuser = { version = "0.18", optional = true, features = ["macos-no-mount"] }
num-derive = { version = "0.5", optional = true }
num-traits = { version = "0.2", optional = true }
tracing = { version = "0.1.31", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }

[dev-dependencies]

# The NFS server's unit tests also run on Linux, where it isn't used.
[target.'cfg(target_os = "linux")'.dev-dependencies]
async-trait = "0.1"
byteorder = "1.4"
num-derive = "0.5"
num-traits = "0.2"
tracing = "0.1.31"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }

[lints]
workspace = true
