[package]
name = "sandfs-cli"
description = "The sandfs command: mount, fork and list the changes of workspaces (over FUSE on Linux, NFS on macOS), or serve one over MCP"
readme = "README.md"
keywords = ["fuse", "nfs", "filesystem", "sandbox", "copy-on-write"]
categories = ["filesystem", "command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version = "1.89"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "sandfs"
path = "src/main.rs"

[features]
default = ["mount"]
# The mount: FUSE on Linux, and on macOS an NFS server on localhost that macOS's own
# NFS client mounts, so nothing needs installing.
mount = ["sandfs/mount"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
sandfs = { workspace = true, default-features = false }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", features = ["user"] }

[lints]
workspace = true
