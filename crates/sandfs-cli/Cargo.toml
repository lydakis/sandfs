[package]
name = "sandfs-cli"
description = "The sandfs command: mount, fork and list the changes of workspaces (over FUSE on Linux, NFS on macOS), or serve one over MCP"
readme = "README.md"
keywords = ["fuse", "nfs", "filesystem", "sandbox", "copy-on-write"]
categories = ["filesystem", "command-line-utilities"]
version.workspace = true
edition.workspace = true
# `File::try_lock`, which keeps one process saving each workspace, is 1.89+.
rust-version = "1.89"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "sandfs"
path = "src/main.rs"

[features]
default = ["mount"]
# The mount: FUSE on Linux, and on macOS an NFS server on localhost that macOS's own
# NFS client mounts, so nothing needs installing.
mount = ["dep:fuser", "dep:nfsserve", "dep:tokio", "dep:async-trait"]

[dependencies]
anyhow = "1"
bytes.workspace = true
clap = { version = "4.5", features = ["derive"] }
sandfs-core.workspace = true
sandfs-git.workspace = true
sandfs-mcp.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["fs", "process", "signal", "user"] }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", optional = true }

# On macOS fuser only lends the NFS mount its types; it never mounts.
[target.'cfg(target_os = "macos")'.dependencies]
async-trait = { version = "0.1", optional = true }
fuser = { version = "0.18", optional = true, features = ["macos-no-mount"] }
nfsserve = { version = "0.11", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }

[dev-dependencies]
tempfile = "3"

# The NFS server's unit tests also run on Linux, where it isn't used.
[target.'cfg(target_os = "linux")'.dev-dependencies]
async-trait = "0.1"
nfsserve = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }

[lints]
workspace = true
