[package]
name = "sandfs-cli"
description = "The sandfs command: mount, fork and list the changes of workspaces over FUSE"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sandfs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
bytes.workspace = true
clap = { version = "4.5", features = ["derive"] }
fuser = "0.18"
sandfs-core.workspace = true
sandfs-git = { path = "../sandfs-git" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
