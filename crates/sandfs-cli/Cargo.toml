[package]
name = "sandfs-cli"
description = "The sandfs command: mount, fork and list the changes of workspaces over FUSE, or serve one over MCP"
readme = "README.md"
keywords = ["fuse", "filesystem", "sandbox", "copy-on-write", "agents"]
categories = ["filesystem", "command-line-utilities"]
version.workspace = true
edition.workspace = true
# `File::try_lock`, which keeps one process saving each workspace, is 1.89+.
rust-version = "1.89"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "sandfs"
path = "src/main.rs"

[features]
default = ["mount"]
# The FUSE mount, on Linux. macOS has no FUSE of its own, so there the feature does
# nothing yet: everything but mounting works.
mount = ["dep:fuser"]

[dependencies]
anyhow = "1"
bytes.workspace = true
clap = { version = "4.5", features = ["derive"] }
sandfs-core.workspace = true
sandfs-git.workspace = true
sandfs-mcp.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["signal"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
fuser = { version = "0.18", optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
