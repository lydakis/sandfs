[package]
name = "sandfs-cli"
description = "The sandfs command: mount, fork and list the changes of workspaces over FUSE, or serve one over MCP"
readme = "README.md"
keywords = ["fuse", "filesystem", "sandbox", "copy-on-write", "agents"]
categories = ["filesystem", "command-line-utilities"]
version.workspace = true
edition.workspace = true
# 1.89 for `File::lock`.
rust-version = "1.89"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "sandfs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
bytes.workspace = true
clap = { version = "4.5", features = ["derive"] }
fuser = "0.18"
sandfs-core.workspace = true
sandfs-git.workspace = true
sandfs-mcp.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
